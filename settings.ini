[Settings]
# Горячая клавиша для активации.
# Используйте <ctrl>, <alt>, <shift>, <space> или обычные буквы/цифры.
# Разделитель - знак плюса (+).
hotkey = <ctrl>+<alt>+<space>

[Whisper]
# Язык для распознавания.
# 'ru' - русский, 'en' - английский.
# 'auto' - для автоматического определения языка.
language = ru

# Размер модели: tiny, base, small, medium, large
# tiny - самая быстрая, large - самая точная.
model_size = base
