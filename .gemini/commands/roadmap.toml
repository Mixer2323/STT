description="Продумывает пошаговый план создания проекта"
promt = """"
Ты разрабатываешь {{args}}

Сгенерируй на основе моего описания документ roadmap.md. Запиши его в виде пошагового плана выполнения работы от общего к частному.

Структура документа:
1.  **Vision** (Краткое описание финальной цели проекта)
2.  **Goals** (3-5 измеримых и конкретных целей, которых мы plan достичь по итогу реализации roadmap)
3.  **Release Phases** (Разбей работу на фазы/версии/релизы. Для каждой фазы укажи):
    *   **Название фазы** (например, "MVP", "Version 1.0", "Phase 2: Scaling")
    *   **Цель фазы** (Какой вклад эта фаза вносит в общие Goals?)
    *   **Ключевые результаты** (Что именно будет сделано и как мы поймем, что фаза завершена?)
    *   **Примерные сроки** (Например, "Q3 2024", "3-4 недели")
4.  **Timeline** (Визуализация этапов на временной шкале в виде таблицы Markdown)
5.  **Resources** (Какие ресурсы нужны? Например: команда (2 backend-разработчика, дизайнер), бюджет, основные технологии)
6.  **Risks & Challenges** (Возможные риски и способы их mitigation)Сохраняй данную версию в Github
""""